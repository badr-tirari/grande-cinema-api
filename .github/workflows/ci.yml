name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests et couverture
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées sur un SHA de commit complet (immuable) plutôt qu'un tag déplaçable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # Versions figées et vérifiées par empreinte (--require-hashes),
      # paquets binaires uniquement : aucun script d'installation n'est exécuté.
      - name: Installer les dépendances
        run: pip install --only-binary :all: --require-hashes -r requirements-dev.lock

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests unitaires + couverture
        run: pytest --cov=app --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=80
