# Blueprint Render (offre gratuite) - la base PostgreSQL est hébergée sur Neon (offre gratuite).
services:
  - type: web
    name: grande-cinema-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install --only-binary :all: --require-hashes -r requirements.lock
    startCommand: python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_USER_PASSWORD
        sync: false
